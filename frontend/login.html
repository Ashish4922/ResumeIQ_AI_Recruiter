<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ResumeIQ</title>

    <link rel="stylesheet" href="login.css">
</head>

<body class="auth-page">

<div class="auth-container">

    <div class="brand">

        <div class="brand-icon">📄</div>

        <h1>Resume<span>IQ</span></h1>

        <p>AI-Powered Resume & Career Assistant</p>

    </div>


    <div class="auth-card">

        <div class="auth-tabs">

            <button
                id="loginTab"
                class="auth-tab active"
                type="button"
                onclick="showLogin()">
                Login
            </button>

            <button
                id="registerTab"
                class="auth-tab"
                type="button"
                onclick="showRegister()">
                Register
            </button>

        </div>


        <div id="message"></div>


        <form id="loginForm">

            <label for="loginEmail">
                Email
            </label>

            <input
                type="email"
                id="loginEmail"
                placeholder="Enter your email"
                required
            >


            <label for="loginPassword">
                Password
            </label>

            <input
                type="password"
                id="loginPassword"
                placeholder="Enter your password"
                required
            >


            <button
                type="submit"
                class="primary-button">
                Login
            </button>

        </form>


        <form
            id="registerForm"
            class="hidden">

            <label for="registerName">
                Name
            </label>

            <input
                type="text"
                id="registerName"
                placeholder="Enter your name"
                required
            >


            <label for="registerEmail">
                Email
            </label>

            <input
                type="email"
                id="registerEmail"
                placeholder="Enter your email"
                required
            >


            <label for="registerPassword">
                Password
            </label>

            <input
                type="password"
                id="registerPassword"
                placeholder="Minimum 6 characters"
                minlength="6"
                required
            >


            <label>
                Account Type
            </label>

            <div class="role-options">

                <label class="role-option">

                    <input
                        type="radio"
                        name="role"
                        value="candidate"
                        checked
                    >

                    <span>
                        Candidate
                    </span>

                </label>


                <label class="role-option">

                    <input
                        type="radio"
                        name="role"
                        value="recruiter"
                    >

                    <span>
                        Recruiter
                    </span>

                </label>

            </div>


            <button
                type="submit"
                class="primary-button">
                Create Account
            </button>

        </form>


        <div class="free-credit-box">

            <strong>🎁 5 Free Analyses</strong>

            <p>
                Every new account receives 5 free
                resume/job analyses.
            </p>

            <p>
                After that:
                <strong>₹10 per analysis</strong>
            </p>

        </div>

    </div>

</div>


<script src="login.js"></script>

</body>

</html>
